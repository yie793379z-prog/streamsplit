name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Show runtime version
        run: node --version
      - name: Run unit and CLI regression tests
        run: node --test
      - name: Install pinned optional parser (no lifecycle scripts)
        run: npm ci --prefix examples/eventsource-parser --ignore-scripts --no-audit --no-fund
      - name: Run real parser adapter regression tests
        run: npm test --prefix examples/eventsource-parser
      - name: Install pinned historical parser comparison (no lifecycle scripts)
        run: npm ci --prefix examples/eventsource-parser-bom-history --ignore-scripts --no-audit --no-fund
      - name: Run historical BOM red/green regression tests
        run: npm test --prefix examples/eventsource-parser-bom-history
